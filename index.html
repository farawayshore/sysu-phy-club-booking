/* Mobile week overview: all seven columns stay inside the viewport. */
@media(max-width:760px){
 .calendar-grid{min-width:0;width:100%}
 .calendar-scroll{overflow-x:hidden;touch-action:pan-y pinch-zoom}
 .days-header{height:62px;grid-template-columns:44px repeat(7,minmax(0,1fr))}
 .axis{width:44px}.day-columns{width:calc(100% - 44px)}
 .axis-head{font-size:9px;line-height:14px;padding:16px 4px 0}
 .day-head{min-width:0;gap:1px;padding:5px 0}
 .day-head>span{font-size:10px}.day-head strong{font-size:16px;line-height:24px;width:24px}
 .day-head small{font-size:9px;line-height:12px}
 .time-label{padding:3px 2px;gap:1px;text-align:center}
 .time-label strong{font-size:9px;line-height:12px;white-space:nowrap}
 .time-label small{font-size:9px;line-height:11px;white-space:normal}
 .time-label small>span{display:block}.time-label .time-separator{display:none}
 .compact-label{padding:0 2px;display:block}.compact-label strong{display:none}
 .compact-label small{font-size:8px;line-height:10px}.compact-label small>span:last-child{display:none}
 .disabled-label{font-size:9px;line-height:14px;overflow-wrap:anywhere}
 .booking{border-left-width:2px;border-radius:3px}
 .booking-content{padding:4px 2px;gap:0}
 .booking-content strong,.booking-content small,.booking .booking-location{display:none}
 .booking-content>span:not(.booking-location){font-size:10px;line-height:12px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
 .calendar-empty{left:44px;right:0;width:auto;padding:0 6px;gap:6px}
 .calendar-empty>strong{font-size:14px}.calendar-empty>span:not(.empty-icon),.calendar-empty small{font-size:11px}
 .empty-icon{width:36px;height:36px}
 .calendar-caption{flex-direction:row;align-items:center;flex-wrap:nowrap;font-size:10px;padding:6px 8px 10px;gap:4px}
 .pages{gap:2px}.pages button,.pages button.active{width:32px;height:36px;font-size:12px}.pages>span{display:none}
 .course-filter{padding:10px 8px}.filter-heading{font-size:12px;gap:6px}
 .grade-options{gap:6px;margin-top:8px}.grade-options label{width:auto;font-size:13px;padding:6px}.grade-options label>span{font-size:10px}
 .grade-options button{font-size:12px;padding:6px 8px}.filter-help,.timetable-note{font-size:10px;line-height:1.5;margin-top:6px}
 .calendar-scale-note,.calendar-footer{font-size:11px;padding:8px;line-height:1.6}
}

.calendar-refresh{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:5px 8px;border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;cursor:pointer;font:inherit;vertical-align:middle}
@media(max-width:760px){.calendar-refresh{min-height:32px}}

/* Sliding page numbers keep the two-month calendar compact on phones. */
.pages button,.pages button.active{width:28px;height:30px;border-radius:5px;font-size:11px}
.pages button>span{display:inline}
@media(max-width:760px){.calendar-caption{flex-wrap:wrap}.pages button,.pages button.active{width:32px;height:36px;font-size:12px}.pages>span{display:inline;font-size:10px;margin-left:5px}}

.profile-filter{min-width:0;margin:12px 0 0;padding:12px 14px;border:1px solid #d9e1eb;border-radius:9px;background:#fff}
.profile-filter legend{padding:0 5px;color:#4d5c70;font-size:12px;font-weight:650}
.profile-row{display:flex;align-items:center;gap:14px;margin:8px 0;font-size:12px}
.profile-row>strong{flex:0 0 52px;color:#667085;font-weight:500}
.profile-row>div{display:flex;flex-wrap:wrap;gap:6px 15px}
.profile-row label{display:inline-flex;align-items:center;gap:5px;min-height:30px;cursor:pointer}
.profile-row input{appearance:auto;accent-color:#6670ac;width:15px;height:15px;min-height:15px;padding:0;flex:none}
.profile-first-year{font-size:12px;color:#667085;margin:4px 0}
.classification-editor{border-top:1px solid #e3e8ed;margin-top:12px;padding-top:12px}
.classification-editor label{display:flex;flex-direction:column;gap:5px;font-size:12px}
.classification-editor select{border:1px solid #dbe1e7;border-radius:6px;padding:8px;background:white;min-width:0}
.audience-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;align-items:end;gap:8px;margin:10px 0}
.classification-editor button{border:1px solid #dbe1e7;background:white;border-radius:6px;padding:8px;font-size:12px;cursor:pointer}
@media(max-width:760px){.profile-filter{padding:8px}.profile-row{gap:6px}.profile-row>strong{flex-basis:48px}.profile-row>div{gap:2px 12px}.profile-row label{min-height:34px}.audience-row{grid-template-columns:1fr 1fr}.classification-editor>label{max-width:100%}}

@media(max-width:760px){.grade-options label>span{display:none}.grade-options label{gap:5px;padding:6px 8px}}

/* Same blue-violet family; only the background/border emphasis changes. */
.course-booking{--course-bg:#f4f5fb;--course-ink:#535d7c;--course-edge:#bac1d8;background:var(--course-bg);color:var(--course-ink);border-color:var(--course-edge)}
.course-required{--course-bg:#4e5da2;--course-ink:#fff;--course-edge:#354581}
.course-elective{--course-bg:#d9def6;--course-ink:#334275;--course-edge:#8190cb}
.course-special{--course-bg:#f0f2fc;--course-ink:#59658c;--course-edge:#bac3e3}
.course-unknown,.course-activity{--course-bg:#f6f7fb;--course-ink:#626b83;--course-edge:#c5cadb}
.course-booking.course-required,.course-booking.course-elective{border-style:solid}
.course-booking .booking-content>strong{color:inherit}
.course-color-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:11px}
.course-color-legend>span{display:inline-flex;align-items:center;gap:5px;color:#626b83}
.course-color-legend>span::before{content:'';width:13px;height:13px;border:1px solid var(--course-edge);border-radius:3px;background:var(--course-bg)}
.course-color-legend small{font-size:10px;color:#767e8c}
@media(max-width:760px){.course-color-legend{font-size:10px;gap:6px 8px}.course-color-legend small{width:100%}}
